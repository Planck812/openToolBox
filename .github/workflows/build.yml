name: Build Desktop App

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure Windows Defender Exclusions
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\Users\runneradmin\.cargo", "C:\npm\cache"
      shell: pwsh

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        cache-all-crates: true

    - name: Cache Tessdata
      uses: actions/cache@v4
      with:
        path: |
          src-tauri/tessdata
          src-tauri/tessdata_fast
        key: tessdata-${{ runner.os }}

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build app (NSIS only)
      run: npm run tauri build -- --bundles nsis
      env:
        CARGO_BUILD_JOBS: 2


    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: src-tauri/target/release/bundle/nsis/*.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: src-tauri/target/release/bundle/nsis/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
