name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不应连带取消另一个平台：跨平台问题往往只出现在单侧，
      # 保留另一侧的产物与日志便于对照定位。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            bundles: nsis
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          # macos-latest 目前为 macos-14-arm64（Apple Silicon）。
          # Intel 机型需另开 macos-13 job，当前未覆盖。
          - os: macos-latest
            label: macOS (Apple Silicon)
            bundles: dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Configure Windows Defender Exclusions
        if: runner.os == 'Windows'
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\Users\runneradmin\.cargo", "C:\npm\cache"
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
          # 缓存按平台隔离，避免不同 OS 的构建产物互相污染。
          key: ${{ matrix.os }}

      - name: Cache Tessdata
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/tessdata
            src-tauri/tessdata_fast
          key: tessdata-${{ runner.os }}

      # tesseract-rs 会从源码编译 leptonica/tesseract，硬依赖 cmake。
      # macos runner 镜像已预装，这里只做存在性校验：缺失时的报错信息
      # （"is `cmake` not installed?"）出现在构建中段，不易一眼定位。
      - name: Verify cmake (macOS)
        if: runner.os == 'macOS'
        run: cmake --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          CARGO_BUILD_JOBS: 2

      # 校验最终产物的签名。直接检查 DMG 内的 .app —— 那才是用户拿到的东西。
      #
      # 不查 bundle/macos/open-toolbox.app：CI 以 `--bundles dmg` 构建，不会在该路径
      # 留下独立 .app（本地不带 --bundles 过滤时才有，曾因此误判为「签名缺失」）。
      #
      # 为什么必须校验：链接器会给可执行文件打一个 linker-signed 的临时签名，
      # 看起来「有签名」，但 .app 作为 bundle 还需要 _CodeSignature/CodeResources
      # 资源封印。缺失时 macOS 判定为「已损坏，应移到废纸篓」—— 用户无法右键放行；
      # 签名正常时才是「无法验证开发者」，可以放行。两者对用户是天壤之别。
      # 该差异只在带 quarantine 下载后才暴露，构建机上测不出来，故在此强制拦截。
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -maxdepth 1 | head -1)
          echo "校验产物: $DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$MNT"
          APP="$MNT/open-toolbox.app"
          if [ ! -d "$APP" ]; then
            hdiutil detach "$MNT" -quiet || true
            echo "::error::DMG 内未找到 open-toolbox.app"
            exit 1
          fi
          codesign -dvv "$APP" 2>&1 | tee /tmp/sig.txt || true
          ls "$APP/Contents/_CodeSignature" 2>/dev/null || echo "(无 _CodeSignature 目录)"
          hdiutil detach "$MNT" -quiet || true

          if ! grep -q "Sealed Resources version" /tmp/sig.txt; then
            echo "::error::bundle 缺少资源封印（_CodeSignature），下载后会被判定为「已损坏」"
            exit 1
          fi
          if grep -q "linker-signed" /tmp/sig.txt; then
            echo "::error::bundle 仅有链接器临时签名，未经 codesign 正式签名"
            exit 1
          fi
          echo "✅ bundle 签名校验通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact v4 要求同一次运行内产物名唯一，矩阵各 job 必须带区分后缀。
          name: build-artifacts-${{ runner.os }}
          path: ${{ matrix.artifact_path }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 各平台 job 分别向同一个 tag 的 release 追加自己的产物。
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
